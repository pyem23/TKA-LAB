<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#F4F5F1">
<title>TKA Reading Lab · Bahasa Inggris B1</title>
<meta name="description" content="Latihan membaca berorientasi TKA Bahasa Inggris (B1).">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&display=swap">
<style>
:root{
  --ground:#F4F5F1; --surface:#FFFFFF; --ink:#15202B; --muted:#4A5562; --line:#DCE0D8;
  --blue:#2B44C2; --blue-ink:#1D2F8C; --blue-tint:#E9EDFB;
  --sun:#F3CF55; --sun-tint:#FBF2D2; --sun-ink:#6B4E00;
  --ok:#17694A; --ok-tint:#E2F2E9; --bad:#A3460A; --bad-tint:#FCEBDD;
  --ease:cubic-bezier(.2,.8,.2,1);
}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--ground);color:var(--ink);font-family:"Atkinson Hyperlegible",system-ui,sans-serif;font-size:17px;line-height:1.6;-webkit-font-smoothing:antialiased}
a{color:var(--blue)}a:hover{color:var(--blue-ink)}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;-webkit-appearance:none;appearance:none}
button:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.disp{font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-0.02em}
.app{min-height:100vh;min-height:100svh;display:flex;flex-direction:column}
.wrap{width:100%;max-width:1040px;margin:0 auto;padding:0 24px;box-sizing:border-box}
.narrow{max-width:760px}

/* ---------- top bar + progress ---------- */
.bar{position:-webkit-sticky;position:sticky;top:0;z-index:5;background:rgba(244,245,241,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);padding-top:env(safe-area-inset-top)}
.barin{display:flex;align-items:center;gap:14px;padding-top:14px;padding-bottom:12px}
.brand{display:flex;align-items:center;gap:10px;flex:0 0 auto;border:0;background:none;padding:0;min-height:44px}
.mark{width:32px;height:32px;border-radius:9px;background:var(--ink);color:#fff;display:grid;place-items:center;font-weight:800;font-size:12px}
.bname{font-weight:800;font-size:17px}
.track{flex:1 1 auto;display:flex;gap:10px;align-items:center;min-width:0}
.grp{display:flex;gap:4px;flex:1 1 0;align-items:center;min-width:0}
.glab{font-size:11px;font-weight:700;color:var(--muted);margin-right:2px;flex:0 0 auto}
.sgm{flex:1 1 0;height:10px;border-radius:999px;background:#E2E5DE;position:relative;overflow:hidden;transition:background .4s var(--ease)}
.sgm.ok{background:var(--ok)}
.sgm.bad{background:var(--bad)}
.sgm.cur{background:#C9CEC4;box-shadow:inset 0 0 0 2px var(--ink)}
.sgm.cur::after{content:"";position:absolute;top:0;right:0;bottom:0;left:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.7),transparent);animation:shine 1.6s infinite}
.pill{flex:0 0 auto;display:flex;align-items:center;gap:6px;border-radius:999px;padding:6px 12px 6px 10px;font-weight:700;font-size:14px;font-variant-numeric:tabular-nums}
.pts{background:var(--ink);color:#fff}
.pts svg{color:var(--sun)}
.clock{background:var(--surface);border:1px solid var(--line);color:var(--ink)}
.pts.bA{animation:bump .5s var(--ease)}
.pts.bB{animation:bump2 .5s var(--ease)}
.line{height:3px;background:var(--line)}
.line i{display:block;height:100%;background:var(--blue);transition:width .6s var(--ease)}
.quiet .track,.quiet .pill{display:none}
.quiet .barin{justify-content:space-between}

/* ---------- scene transitions ---------- */
.stage{flex:1 1 auto;display:flex;flex-direction:column}
.scene{flex:1 1 auto;padding:48px 0 40px}
.scene.a{animation:inA .55s var(--ease) backwards}
.scene.b{animation:inB .55s var(--ease) backwards}
.scene.a .stg > *{animation:riseA .6s var(--ease) both}
.scene.b .stg > *{animation:riseB .6s var(--ease) both}
.stg > *:nth-child(1){animation-delay:.05s}
.stg > *:nth-child(2){animation-delay:.14s}
.stg > *:nth-child(3){animation-delay:.23s}
.stg > *:nth-child(4){animation-delay:.32s}
.stg > *:nth-child(5){animation-delay:.41s}
.stg > *:nth-child(6){animation-delay:.50s}
@keyframes inA{from{opacity:0}to{opacity:1}}
@keyframes inB{from{opacity:0}to{opacity:1}}
@keyframes riseA{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes riseB{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes shine{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
@keyframes bump{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes bump2{0%{transform:scale(1)}40%{transform:scale(1.18)}100%{transform:scale(1)}}
@keyframes pop{0%{opacity:0;transform:scale(.92) translateY(8px)}100%{opacity:1;transform:none}}
@keyframes draw{from{stroke-dashoffset:60}to{stroke-dashoffset:0}}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes slideIn{from{opacity:0;transform:translateX(-16px)}to{opacity:1;transform:none}}
@keyframes sheetUp{from{transform:translateY(100%)}to{transform:none}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes grow{from{transform:scaleX(0)}to{transform:scaleX(1)}}
@media (prefers-reduced-motion: reduce){*{animation:none !important;transition:none !important}}

/* ---------- generic ---------- */
.eyebrow{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0}
.h1{font-size:clamp(42px,7vw,84px);line-height:.98;margin:0;font-weight:800}
.h1 em{font-style:normal;background:linear-gradient(transparent 64%,var(--sun) 64%);padding:0 4px}
.h2{font-size:clamp(32px,4.4vw,48px);line-height:1.05;margin:0;font-weight:800}
.lead{font-size:19px;color:var(--muted);margin:0;max-width:600px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:20px}
.chip{display:inline-flex;align-items:center;gap:6px;font-size:13px;font-weight:700;border-radius:999px;padding:4px 12px;line-height:1.5}
.chip.l1{background:var(--blue-tint);color:var(--blue-ink)}
.chip.l2{background:var(--sun-tint);color:var(--sun-ink)}
.chip.l3{background:var(--ink);color:#fff}
.chip.plain{background:var(--surface);color:var(--muted);border:1px solid var(--line)}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:10px;border:0;border-radius:14px;padding:14px 24px;min-height:50px;font-weight:700;font-size:16px;background:var(--blue);color:#fff;transition:transform .15s var(--ease),background .2s}
.btn:hover{background:var(--blue-ink)}
.btn:active{transform:scale(.97)}
.btn.ghost{background:transparent;color:var(--ink);border:1.5px solid var(--ink)}
.btn.ghost:hover{background:var(--ink);color:#fff}
.btn.dark{background:var(--ink)}
.btn.dark:hover{background:#000}
.btn:disabled{background:#D3D7DD;color:#4A5562;cursor:not-allowed;transform:none}
.btn .ar{transition:transform .2s var(--ease)}
.btn:hover .ar{transform:translateX(4px)}
.link{border:0;background:none;font-weight:700;font-size:15px;color:var(--blue);padding:10px 6px;min-height:44px;display:inline-flex;align-items:center;gap:8px}
.link:hover{color:var(--blue-ink)}

/* ---------- intro ---------- */
.intro{display:flex;flex-direction:column;gap:26px;padding-top:6vh}
.introArt{display:flex;gap:10px;align-items:flex-end;height:88px}
.introArt span{display:block;width:56px;border-radius:14px 14px 4px 4px}
.facts{display:flex;flex-wrap:wrap;gap:8px}

/* ---------- know (4 parts) ---------- */
.parts{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-top:28px}
.part{padding:22px 20px;display:flex;flex-direction:column;gap:8px;position:relative;transition:transform .25s var(--ease),box-shadow .25s}
.part:hover{transform:translateY(-4px);box-shadow:0 12px 30px rgba(21,32,43,.08)}
.part .ic{width:46px;height:46px;border-radius:12px;display:grid;place-items:center;background:var(--ground);margin-bottom:6px}
.part .ic svg path,.part .ic svg circle{stroke-dasharray:60;animation:draw 1.1s var(--ease) both .4s}
.part h3{margin:0;font-size:19px}
.part p{margin:0;font-size:15px;color:var(--muted);line-height:1.5}
.part .n{position:absolute;top:18px;right:18px;font-size:12px;font-weight:700;color:var(--muted)}

/* ---------- accordion ---------- */
.accs{display:flex;flex-direction:column;gap:10px;margin-top:28px}
.acc{background:var(--surface);border:1px solid var(--line);border-radius:18px;overflow:hidden;transition:border-color .3s,box-shadow .3s}
.acc.open{border-color:var(--ink);box-shadow:0 10px 30px rgba(21,32,43,.07)}
.acc-h{width:100%;display:flex;align-items:center;gap:16px;text-align:left;border:0;background:none;padding:18px 20px;min-height:64px}
.acc-h .num{flex:0 0 auto;width:46px;height:46px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:18px}
.acc-h .num.l1{background:var(--blue);color:#fff}
.acc-h .num.l2{background:var(--sun);color:var(--ink)}
.acc-h .num.l3{background:var(--ink);color:#fff}
.acc-h .tt{flex:1 1 auto;display:flex;flex-direction:column}
.acc-h .tt b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:22px;letter-spacing:-.01em;line-height:1.15}
.acc-h .tt span{font-size:14px;color:var(--muted)}
.chev{flex:0 0 auto;width:36px;height:36px;border-radius:50%;border:1.5px solid var(--line);display:grid;place-items:center;transition:transform .35s var(--ease),background .3s}
.acc.open .chev{transform:rotate(180deg);background:var(--ink);border-color:var(--ink);color:#fff}
.acc-b{display:grid;grid-template-rows:0fr;transition:grid-template-rows .45s var(--ease)}
.acc.open .acc-b{grid-template-rows:1fr}
.acc-in{overflow:hidden;min-height:0}
.acc-pad{padding:0 20px 20px 82px;opacity:0;transform:translateY(-6px);transition:opacity .35s .1s,transform .35s .1s var(--ease)}
.acc.open .acc-pad{opacity:1;transform:none}
.acc-pad p{margin:0 0 10px;color:var(--muted)}
.ticks{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.ticks li{padding-left:22px;position:relative;font-size:16px}
.ticks li::before{content:"";position:absolute;left:0;top:10px;width:10px;height:2px;background:var(--ink)}
.tapnote{font-size:14px;color:var(--muted);margin-top:12px}

/* ---------- mission map ---------- */
.maphead{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:flex-end;gap:16px}
.tally{display:flex;gap:8px;flex-wrap:wrap}
.missions{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-top:28px}
.ms{padding:22px;display:flex;flex-direction:column;gap:10px;position:relative;transition:transform .25s var(--ease),box-shadow .25s,border-color .25s}
.ms.ready:hover{transform:translateY(-4px);box-shadow:0 14px 32px rgba(21,32,43,.08);border-color:var(--ink)}
.ms.soon{background:transparent;border-style:dashed}
.ms.soon .mt,.ms.soon .md{color:var(--muted)}
.mtop{display:flex;justify-content:space-between;align-items:center;gap:8px}
.mnum{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;font-weight:800;font-size:17px;background:var(--ground)}
.ms.ready .mnum{background:var(--ink);color:#fff}
.ms.done .mnum{background:var(--sun);color:var(--ink)}
.mt{margin:0;font-size:24px;font-weight:800;line-height:1.1}
.md{margin:0;font-size:15px;color:var(--muted);line-height:1.5;flex:1 1 auto}
.mstat{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:14px;font-weight:700;font-variant-numeric:tabular-nums}
.mstat span{display:inline-flex;align-items:center;gap:6px}
.mbar{height:6px;border-radius:999px;background:var(--ground);overflow:hidden}
.mbar i{display:block;height:100%;background:var(--ok);border-radius:999px;transition:width .6s var(--ease)}
.ms .btn{align-self:stretch;margin-top:4px}
.soonTag{align-self:flex-start;font-size:13px;font-weight:700;color:var(--muted);border:1px dashed var(--muted);border-radius:999px;padding:4px 12px}
.badge{font-size:12px;font-weight:700;border-radius:999px;padding:2px 10px}
.badge.gold{background:var(--sun);color:var(--ink)}
.badge.silver{background:#D9DEE5;color:#2A333D}
.badge.bronze{background:#E8C2A0;color:#4E2A0C}

/* ---------- reader ---------- */
.readhead{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:flex-end;margin-bottom:20px}
.toggle{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);border-radius:999px;padding:6px 14px 6px 6px;min-height:42px;background:var(--surface);font-size:14px;font-weight:700}
.toggle .sw{width:36px;height:22px;border-radius:999px;background:#C9CED6;position:relative;transition:background .25s}
.toggle .sw::after{content:"";position:absolute;top:3px;left:3px;width:16px;height:16px;border-radius:50%;background:#fff;transition:left .25s var(--ease)}
.toggle.on .sw{background:var(--blue)}
.toggle.on .sw::after{left:17px}
.reader{padding:30px 32px}
.reader h3{font-size:28px;margin:0 0 4px;font-weight:800;line-height:1.15}
.rmeta{font-size:13px;color:var(--muted);margin:0 0 18px}
.para{display:flex;gap:14px;margin:0 0 10px -10px;border-radius:12px;padding:8px 10px;transition:background .4s var(--ease)}
.para .pn{flex:0 0 26px;font-size:12px;font-weight:700;color:var(--muted);padding-top:5px}
.para p{margin:0;font-size:17.5px;line-height:1.75}
.para .stg-l{display:block;max-height:0;opacity:0;overflow:hidden;font-size:12px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;transition:max-height .35s var(--ease),opacity .3s}
.struct .para.or{background:var(--blue-tint)}
.struct .para.ev{background:var(--sun-tint)}
.struct .para.re{background:#E7E9EC}
.struct .para .stg-l{max-height:24px;opacity:1;margin-bottom:2px}
.gwords{display:flex;flex-wrap:wrap;gap:6px}
.gw{border:1px solid var(--line);background:var(--ground);border-radius:10px;padding:6px 12px;min-height:38px;font-size:14px;font-weight:700;transition:background .2s,color .2s}
.gw.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.gdef{margin:12px 0 0;font-size:15px;background:var(--ground);border-radius:12px;padding:12px 14px;animation:pop .35s var(--ease)}

/* ---------- level gate ---------- */
.gate{display:flex;flex-direction:column;gap:22px;align-items:flex-start;padding-top:3vh}
.bignum{font-size:clamp(110px,18vw,200px);line-height:.8;font-weight:800;letter-spacing:-.06em}
.bignum.l1{color:var(--blue)}
.bignum.l2{color:var(--sun)}
.bignum.l3{color:var(--ink)}
.strat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;width:100%}
.st{padding:20px;display:flex;flex-direction:column;gap:4px}
.st .sn{font-size:12px;font-weight:700;color:var(--muted)}
.st b{font-size:18px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.st span{font-size:15px;color:var(--muted);line-height:1.5}
.gatemeta{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:15px;color:var(--muted)}

/* ---------- question ---------- */
.qtop{display:flex;flex-wrap:wrap;gap:10px;justify-content:space-between;align-items:center;margin-bottom:18px}
.qcount{font-size:14px;font-weight:700;color:var(--muted)}
.qcount b{color:var(--ink);font-size:22px;font-family:"Bricolage Grotesque",system-ui,sans-serif}
.qlayout{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-start}
.qmain{flex:999 1 480px;min-width:0}
.qtext{flex:1 1 380px;min-width:0;position:-webkit-sticky;position:sticky;top:96px;animation:slideIn .45s var(--ease) both}
.qtext .reader{padding:22px 24px;max-height:68vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
.qtext .para p{font-size:16px;line-height:1.7}
.qcard{padding:28px 30px}
.stem{font-size:22px;font-weight:700;margin:0 0 4px;line-height:1.4;font-family:"Bricolage Grotesque",system-ui,sans-serif;letter-spacing:-.01em}
.instr{margin:0 0 18px;font-size:15px;color:var(--muted);font-style:italic}
.opts{display:flex;flex-direction:column;gap:8px}
.opt{display:flex;align-items:flex-start;gap:14px;text-align:left;width:100%;border:1.5px solid var(--line);background:var(--surface);border-radius:14px;padding:12px 14px;min-height:54px;transition:border-color .2s,background .25s,transform .15s var(--ease)}
.opt:hover{border-color:var(--ink);transform:translateX(3px)}
.opt .lt{flex:0 0 32px;height:32px;border-radius:9px;border:1.5px solid var(--line);display:grid;place-items:center;font-weight:700;font-size:14px;color:var(--muted);transition:all .2s}
.opt.box .lt{border-radius:6px}
.opt .ot{padding-top:3px;line-height:1.5}
.opt.sel{border-color:var(--blue);background:var(--blue-tint)}
.opt.sel .lt{background:var(--blue);border-color:var(--blue);color:#fff}
.opt.ok{border-color:var(--ok);background:var(--ok-tint)}
.opt.ok .lt{background:var(--ok);border-color:var(--ok);color:#fff}
.opt.bad{border-color:var(--bad);background:var(--bad-tint)}
.opt.bad .lt{background:var(--bad);border-color:var(--bad);color:#fff}
.opt.lock{cursor:default}
.opt.lock:hover{transform:none}
.opt .tagr{margin-left:auto;flex:0 0 auto;font-size:12px;font-weight:700;padding-top:7px}
.opt.ok .tagr{color:var(--ok)}
.opt.bad .tagr{color:var(--bad)}
.cat{display:flex;flex-direction:column;border:1.5px solid var(--line);border-radius:14px;overflow:hidden}
.catrow{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding:12px 14px;border-top:1px solid var(--line);transition:background .3s}
.catrow:first-child{border-top:0}
.catrow.ok{background:var(--ok-tint)}
.catrow.bad{background:var(--bad-tint)}
.cattext{flex:1 1 240px;line-height:1.45}
.seg{display:flex;gap:4px;background:var(--ground);border-radius:12px;padding:4px;flex:0 0 auto}
.sg{border:0;background:transparent;border-radius:9px;padding:8px 14px;min-height:40px;font-size:14px;font-weight:700;color:var(--muted);transition:background .2s,color .2s}
.sg:hover{color:var(--ink)}
.sg.sel{background:var(--blue);color:#fff}
.sg.ok{background:var(--ok);color:#fff}
.sg.bad{background:var(--bad);color:#fff}
.qfoot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:20px}
.drop{display:grid;grid-template-rows:0fr;transition:grid-template-rows .4s var(--ease)}
.drop.open{grid-template-rows:1fr}
.drop > div{overflow:hidden;min-height:0}
.hint{margin-top:12px;background:var(--sun-tint);border-radius:14px;padding:14px 16px;font-size:15px}
.hint b{display:block;font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--sun-ink);margin-bottom:2px}
.fb{margin-top:16px;border-radius:16px;padding:16px 18px;animation:pop .45s var(--ease) both}
.fb.ok{background:var(--ok-tint)}
.fb.bad{background:var(--bad-tint)}
.vd{display:flex;align-items:center;gap:10px;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-weight:800;font-size:22px}
.fb.ok .vd{color:var(--ok)}
.fb.bad .vd{color:var(--bad)}
.vd .plus{margin-left:auto;font-size:15px;background:var(--ok);color:#fff;border-radius:999px;padding:2px 12px}
.fb .det{margin:4px 0 0;font-size:15px}
.fb .exp{margin:10px 0 0;font-size:15px;line-height:1.6;padding-top:10px;border-top:1px solid rgba(21,32,43,.1)}

/* ---------- bottom nav + text sheet ---------- */
.bnav{position:-webkit-sticky;position:sticky;bottom:0;z-index:4;background:rgba(244,245,241,.96);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom)}
.bnavin{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-top:12px;padding-bottom:12px}
.bmid{font-size:14px;color:var(--muted);text-align:center;flex:1 1 auto}
.sheethead{display:none}
.scrim{display:none}

/* ---------- result ---------- */
.medal{width:132px;height:132px;border-radius:50%;display:grid;place-items:center;position:relative;animation:pop .6s var(--ease) both;flex:0 0 auto}
.medal::before{content:"";position:absolute;top:-8px;right:-8px;bottom:-8px;left:-8px;border-radius:50%;border:2px dashed currentColor;opacity:.5;animation:spin 18s linear infinite}
.medal.gold{background:var(--sun);color:var(--sun-ink)}
.medal.silver{background:#D9DEE5;color:#3A4450}
.medal.bronze{background:#E8C2A0;color:#6B3A12}
.medal b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:34px;line-height:1;color:var(--ink);display:block;text-align:center}
.medal span{font-size:11px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;display:block;text-align:center;color:var(--ink)}
.reshead{display:flex;flex-wrap:wrap;gap:28px;align-items:center}
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:28px}
.stat{padding:18px 20px}
.stat span{display:block;font-size:13px;font-weight:700;color:var(--muted);text-transform:uppercase;letter-spacing:.06em}
.stat b{display:block;font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:30px;line-height:1.2;font-variant-numeric:tabular-nums}
.lres{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;margin-top:12px}
.lr{padding:20px;display:flex;flex-direction:column;gap:10px}
.lr h3{margin:0;font-size:20px;font-weight:800}
.meter{height:10px;background:var(--ground);border-radius:999px;overflow:hidden;border:1px solid var(--line)}
.meter i{display:block;height:100%;background:var(--ink);border-radius:999px;animation:grow 1s var(--ease) both .3s;transform-origin:left}
.lr .num{font-weight:700;font-size:15px}
.lr p{margin:0;font-size:15px;color:var(--muted)}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;margin-top:24px}

/* touch devices: no sticky hover effects */
@media (hover:none){
  .opt:hover,.part:hover,.ms.ready:hover{transform:none}
  .opt:hover{border-color:var(--line)}
  .opt.sel:hover{border-color:var(--blue)}
  .opt.ok:hover{border-color:var(--ok)}
  .opt.bad:hover{border-color:var(--bad)}
  .part:hover,.ms.ready:hover{box-shadow:none}
  .ms.ready:hover{border-color:var(--line)}
  .btn:hover .ar{transform:none}
  .btn:hover{background:var(--blue)}
  .btn.dark:hover{background:var(--ink)}
  .btn.ghost:hover{background:transparent;color:var(--ink)}
}

@media (max-width:860px){
  .parts{grid-template-columns:repeat(2,minmax(0,1fr))}
  .missions{grid-template-columns:repeat(2,minmax(0,1fr))}
  .strat,.lres{grid-template-columns:minmax(0,1fr)}
  .glab{display:none}
  .scrim{display:block;position:fixed;top:0;right:0;bottom:0;left:0;z-index:8;border:0;background:rgba(21,32,43,.45);animation:fadeIn .3s both}
  .qtext{position:fixed;left:0;right:0;bottom:0;top:auto;z-index:9;animation:sheetUp .4s var(--ease) both}
  .qtext .reader{border-radius:22px 22px 0 0;max-height:78vh;max-height:78svh;padding:0 20px calc(24px + env(safe-area-inset-bottom));border-bottom:0}
  .sheethead{display:flex;align-items:center;justify-content:space-between;gap:12px;position:-webkit-sticky;position:sticky;top:0;background:var(--surface);padding:14px 0 10px;margin-bottom:6px;border-bottom:1px solid var(--line);z-index:1}
  .sheethead b{font-family:"Bricolage Grotesque",system-ui,sans-serif;font-size:18px}
  .sheethead button{border:1.5px solid var(--ink);background:var(--surface);border-radius:999px;padding:8px 16px;min-height:44px;font-weight:700;font-size:14px;flex:0 0 auto}
  .qtext .reader h3,.qtext .reader .rmeta{display:none}
}
@media (max-width:560px){
  body{font-size:16px}
  .wrap{padding:0 16px}
  .parts,.missions,.stats{grid-template-columns:minmax(0,1fr)}
  .barin{flex-wrap:wrap;gap:10px 8px;padding-top:10px;padding-bottom:10px}
  .brand{margin-right:auto}
  .bname{font-size:16px}
  .track{order:3;flex:1 1 100%;gap:6px}
  .sgm{height:8px}
  .pill{font-size:13px;padding:5px 10px 5px 8px}
  .reader,.qcard{padding:22px 18px}
  .qtext .reader{padding:0 18px calc(24px + env(safe-area-inset-bottom))}
  .acc-pad{padding:0 18px 18px 18px}
  .acc-h{padding:16px;gap:12px}
  .acc-h .tt b{font-size:19px}
  .scene{padding:28px 0 28px}
  .bmid{display:none}
  .bnavin .btn{padding:12px 16px}
  .bnavin .btn:last-child{flex:1 1 auto}
  .stem{font-size:19px}
  .lead{font-size:17px}
  .para p{font-size:16.5px}
  .seg{flex:1 1 100%}
  .sg{flex:1 1 0;padding:8px 6px}
  .qfoot .btn{flex:1 1 100%}
  .qfoot .link.tx{margin-left:0}
  .opt{padding:12px}
  .opt .tagr{font-size:11px}
  .medal{width:112px;height:112px}
  .btnrow .btn{flex:1 1 100%}
  .stat b{font-size:26px}
}

.fsbtn{flex:0 0 auto;display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:6px 12px;border-radius:999px;border:1.5px solid var(--ink);background:var(--surface);color:var(--ink);font-weight:700;font-size:14px;text-decoration:none;cursor:pointer}
.fsbtn:hover{background:var(--ink);color:#fff}
@media (hover:none){.fsbtn:hover{background:var(--surface);color:var(--ink)}}
@media (max-width:560px){.fsl{display:none}.fsbtn{padding:6px 10px}}
</style>

  words: 267,
  paras: [
    { stage: "Identification · what it is", k: "or", text: "The Komodo dragon is the largest lizard in the world. It lives only in Indonesia, on a few islands in East Nusa Tenggara, such as Komodo, Rinca, and parts of Flores. Because of its huge size, many people call it a “living dinosaur”, although it is not actually a dinosaur." },
    { stage: "Description · body", k: "ev", text: "An adult Komodo dragon can grow up to three metres long. It usually weighs around 70 kilograms, although some are much heavier. Its skin is rough and grey-brown, and it is covered in small, hard scales. It has a long, strong tail, short legs, and sharp, curved claws. Its mouth is full of teeth with edges like a saw." },
    { stage: "Description · senses & hunting", k: "ev", text: "The Komodo dragon’s hearing is not very good, but it has an excellent sense of smell. It uses its long, yellow, forked tongue to “taste” the air, and it can find a dead animal from several kilometres away. It usually hunts by waiting quietly near a path. When a deer or a wild pig walks by, the dragon attacks suddenly. Its bite is dangerous because scientists have found venom glands in its lower jaw. Even if the animal escapes, it often becomes weak and dies later." },

  { id: "proc", n: "3", type: "Procedure", title: "How-to Infographic", context: "Everyday", desc: "Membaca langkah-langkah dalam bentuk infografis." },
  { id: "narr", n: "4", type: "Narrative", title: "A Folktale from Nusantara", context: "Everyday", desc: "Cerita rakyat: tokoh, konflik, dan pesan moral." },
  { id: "expo", n: "5", type: "Analytical Exposition", title: "A Teen Issue", context: "Academic", desc: "Argumen, fakta, dan opini tentang isu remaja." }
];

var MISSIONS = [DESC, REC];
var MAP_ORDER = [DESC, REC].concat(SOON);
var LETTERS = ["A", "B", "C", "D", "E", "F"];
var ONB = ["intro", "know", "levels", "map"];
var MS = ["read",
  "g:l1", "q1", "q2", "q3", "q4", "q5",
  "g:l2", "q6", "q7", "q8", "q9", "q10",
  "g:l3", "q11", "q12", "q13", "q14", "q15",
  "result"];
var LAST = MS.length - 1;

function getMission(id) { for (var i = 0; i < MISSIONS.length; i++) if (MISSIONS[i].id === id) return MISSIONS[i]; return null; }
function qById(m, id) { for (var i = 0; i < m.qs.length; i++) if (m.qs[i].id === id) return m.qs[i]; return null; }
function fmt(ms) {
  var s = Math.max(0, Math.floor(ms / 1000));
  var h = Math.floor(s / 3600), m = Math.floor((s % 3600) / 60), r = s % 60;
  var pad = function (x) { return (x < 10 ? "0" : "") + x; };
  return h > 0 ? h + ":" + pad(m) + ":" + pad(r) : pad(m) + ":" + pad(r);
}

class TkaCore extends PComponent {
  constructor(props) {
    super(props);
    this.state = {
      view: "intro", mid: null, i: 0, moves: 0,
      ans: {}, checked: {}, tries: {}, hints: {}, exps: {},
      pos: {}, timers: {}, now: Date.now(),
      showStruct: false, showText: false, gloss: -1, acc: -1, wb: false, ref: false, bump: 0
    };
  }

  componentDidMount() {
    var self = this;
    this.tick = setInterval(function () {
      var st = self.state;
      var t = st.mid ? st.timers[st.mid] : null;
      if (st.view === "run" && t && t.since) self.setState({ now: Date.now() });
    }, 1000);
  }
  componentWillUnmount() { if (this.tick) clearInterval(this.tick); }

  componentDidUpdate(prevProps, prevState) {
    if (prevState && prevState.moves !== this.state.moves) {
      try { window.scrollTo({ top: 0, behavior: "smooth" }); } catch (e) { try { window.scrollTo(0, 0); } catch (e2) {} }
    }
  }

  /* ---------- timer: counts up, only while the mission is open ---------- */
  pauseTimer(timers, mid, now) {
    var t = timers[mid];
    if (t && t.since) { timers[mid] = { acc: t.acc + (now - t.since), since: null, done: t.done }; }
  }
  elapsed(mid) {
    var t = this.state.timers[mid];
    if (!t) return 0;
    return t.acc + (t.since ? this.state.now - t.since : 0);
  }

  /* ---------- navigation ---------- */
  goOnb(view) {
    var now = Date.now();
    var timers = Object.assign({}, this.state.timers);
    var pos = Object.assign({}, this.state.pos);
    if (this.state.view === "run" && this.state.mid) {
      this.pauseTimer(timers, this.state.mid, now);
      pos[this.state.mid] = this.state.i;
    }
    this.setState({ view: view, timers: timers, pos: pos, now: now, showText: false, moves: this.state.moves + 1 });
  }
  openMission(mid) {
    var now = Date.now();
    var timers = Object.assign({}, this.state.timers);
    var t = timers[mid];
    var i = this.state.pos[mid] || 0;
    if (t && t.done) { i = LAST; }
    else { timers[mid] = { acc: t ? t.acc : 0, since: now, done: false }; }
    this.setState({ view: "run", mid: mid, i: i, timers: timers, now: now, showText: false, showStruct: false, gloss: -1, wb: false, ref: false, moves: this.state.moves + 1 });
  }
  goScene(i) {
    var st = this.state, now = Date.now();
    i = Math.max(0, Math.min(LAST, i));
    var timers = Object.assign({}, st.timers);
    if (i === LAST) {
      var t = timers[st.mid];
      if (t && !t.done) timers[st.mid] = { acc: t.acc + (t.since ? now - t.since : 0), since: null, done: true };
    }
    this.setState({ i: i, timers: timers, now: now, moves: st.moves + 1 });
  }
  restartMission() {
    var st = this.state, mid = st.mid, pre = mid + "/";
    var strip = function (o) { var n = {}; for (var k in o) { if (k.indexOf(pre) !== 0) n[k] = o[k]; } return n; };
    var now = Date.now();
    var timers = Object.assign({}, st.timers); timers[mid] = { acc: 0, since: now, done: false };
    var pos = Object.assign({}, st.pos); pos[mid] = 0;
    this.setState({ ans: strip(st.ans), checked: strip(st.checked), tries: strip(st.tries), hints: strip(st.hints), exps: strip(st.exps),
      timers: timers, pos: pos, i: 0, now: now, showText: false, ref: false, moves: st.moves + 1 });
  }

  /* ---------- scoring ---------- */
  isCorrect(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "pg") return a === q.key;
    if (q.type === "multi") {
      for (var i = 0; i < q.options.length; i++) { if (!!a[i] !== (q.keys.indexOf(i) !== -1)) return false; }
      return true;
    }
    for (var j = 0; j < q.items.length; j++) { if (a[j] !== q.items[j].k) return false; }
    return true;
  }
  isComplete(q, a) {
    if (a === undefined || a === null) return false;
    if (q.type === "pg") return true;
    if (q.type === "multi") { for (var k in a) { if (a[k]) return true; } return false; }
    for (var j = 0; j < q.items.length; j++) { if (!a[j]) return false; }
    return true;
  }
  gainFor(m, q) {
    var st = this.state, k = m.id + "/" + q.id;
    if (!st.checked[k] || !this.isCorrect(q, st.ans[k])) return 0;
    return (st.tries[k] || 1) === 1 ? 10 : 5;
  }
  missionPoints(m) { var self = this, p = 0; m.qs.forEach(function (q) { p += self.gainFor(m, q); }); return p; }
  missionChecked(m) { var st = this.state, n = 0; m.qs.forEach(function (q) { if (st.checked[m.id + "/" + q.id]) n++; }); return n; }
  medalFor(p) {
    return p >= 130 ? { cls: "medal gold", badge: "badge gold", name: "Gold", title: "Gold reader!" }
      : p >= 95 ? { cls: "medal silver", badge: "badge silver", name: "Silver", title: "Silver reader!" }
      : { cls: "medal bronze", badge: "badge bronze", name: "Bronze", title: "Bronze reader. Keep going!" };
  }

  setAns(k, val) { var ans = Object.assign({}, this.state.ans); ans[k] = val; this.setState({ ans: ans }); }
  flip(key, k) { var o = Object.assign({}, this.state[key]); o[k] = !o[k]; var s = {}; s[key] = o; this.setState(s); }

  buildQ(m, q) {
    var self = this, st = this.state, k = m.id + "/" + q.id;
    var a = st.ans[k];
    var checked = !!st.checked[k];
    var correct = checked && this.isCorrect(q, a);
    var gain = this.gainFor(m, q);
    var vm = {
      num: q.num, sub: q.sub, stem: q.stem, instr: q.instr, hint: q.hint, explain: q.explain,
      chipCls: "chip " + q.lv, levelName: LEVELS[q.lv].chip,
      isOpts: q.type === "pg" || q.type === "multi", isCat: q.type === "cat",
      checked: checked, open: !checked, canRetry: checked && !correct,
      noCheck: !this.isComplete(q, a),
      showHint: !!st.hints[k], hintLabel: st.hints[k] ? "Hide hint" : "Hint",
      hintCls: "drop" + (st.hints[k] && !checked ? " open" : ""),
      showExp: !!st.exps[k], expLabel: st.exps[k] ? "Tutup pembahasan" : "Lihat pembahasan",
      expCls: "drop" + (st.exps[k] ? " open" : ""),
      fbCls: correct ? "fb ok" : "fb bad",
      verdict: correct ? (gain === 10 ? "Excellent!" : "Got it!") : "Not quite yet.",
      gained: gain > 0, gain: gain,
      toggleHint: function () { self.flip("hints", k); },
      toggleExp: function () { self.flip("exps", k); },
      check: function () {
        if (!self.isComplete(q, self.state.ans[k])) return;
        var c = Object.assign({}, self.state.checked); c[k] = true;
        var t = Object.assign({}, self.state.tries); t[k] = (t[k] || 0) + 1;
        self.setState({ checked: c, tries: t, bump: self.state.bump + 1 });
      },
      retry: function () {
        var c = Object.assign({}, self.state.checked); delete c[k];
        var an = Object.assign({}, self.state.ans); delete an[k];
        var ex = Object.assign({}, self.state.exps); delete ex[k];
        self.setState({ checked: c, ans: an, exps: ex });
      }
    };

    if (vm.isOpts) {
      var multi = q.type === "multi";
      vm.options = q.options.map(function (text, i) {
        var sel = multi ? !!(a && a[i]) : a === i;
        var isKey = multi ? q.keys.indexOf(i) !== -1 : q.key === i;
        var cls = "opt" + (multi ? " box" : ""), tag = "";
        if (checked) {
          cls += " lock";
          if (correct) { if (isKey) { cls += " ok"; tag = "Benar"; } }
          else if (sel && !isKey) { cls += " bad"; tag = "Pengecoh"; }
          else if (sel && isKey) { cls += " sel"; }
        } else if (sel) { cls += " sel"; }
        return {
          letter: LETTERS[i], text: text, cls: cls, tag: tag, pressed: sel,
          pick: function () {
            if (self.state.checked[k]) return;
            if (multi) { var cur = Object.assign({}, self.state.ans[k] || {}); cur[i] = !cur[i]; self.setAns(k, cur); }
            else self.setAns(k, i);
          }
        };
      });
      if (checked) {
        if (correct) vm.detail = multi ? "Semua jawaban benar sudah kamu pilih." : "Jawabanmu didukung bukti di teks.";
        else if (multi) {
          var r = 0, w = 0;
          q.options.forEach(function (t, i) { var s = !!(a && a[i]), kk = q.keys.indexOf(i) !== -1; if (s && kk) r++; if (s && !kk) w++; });
          vm.detail = "Kamu menemukan " + r + " dari " + q.keys.length + " jawaban benar" + (w ? ", dan memilih " + w + " pengecoh." : ".") + " Coba lagi, atau buka pembahasan.";
        } else vm.detail = "Opsi " + LETTERS[a] + " adalah pengecoh. Cari lagi buktinya di teks, lalu coba lagi.";
      }
    } else {
      var cur = a || {}, nRight = 0;
      vm.items = q.items.map(function (it, j) {
        var v = cur[j], rowOk = v === it.k;
        if (rowOk) nRight++;
        return {
          text: it.t,
          cls: "catrow" + (checked ? (rowOk ? " ok" : " bad") : ""),
          choices: q.cats.map(function (c) {
            var sel = v === c, cls = "sg";
            if (checked) { if (sel && rowOk) cls += " ok"; else if (sel) cls += " bad"; }
            else if (sel) cls += " sel";
            var label = c === "Early" ? "Early (Mon–Tue)" : c === "Later" ? "Later (Wed–Fri)" : c;
            return { name: label, cls: cls, pressed: sel, pick: function () {
              if (self.state.checked[k]) return;
              var nx = Object.assign({}, self.state.ans[k] || {}); nx[j] = c; self.setAns(k, nx);
            } };
          })
        };
      });
      if (checked) vm.detail = correct ? "Semua pernyataan tepat." : nRight + " dari " + q.items.length + " pernyataan tepat. Baris oranye masih salah.";
    }
    return vm;
  }

  renderVals() {
    var self = this, st = this.state;
    var run = st.view === "run";
    var m = run ? getMission(st.mid) : null;
    var scene = run ? MS[st.i] : st.view;
    var kind = scene.indexOf("g:") === 0 ? "gate" : (/^q\d+$/.test(scene) ? "q" : scene);

    /* ---- map ---- */
    var tallyPts = 0, tallyDone = 0;
    var missions = MAP_ORDER.map(function (x) {
      var ready = !!x.qs;
      if (!ready) return { n: x.n, type: x.type, title: x.title, context: x.context, desc: x.desc, ready: false, soon: true, cls: "card ms soon" };
      var pts = self.missionPoints(x), cnt = self.missionChecked(x);
      var t = st.timers[x.id], done = !!(t && t.done);
      tallyPts += pts; if (done) tallyDone++;
      var md = self.medalFor(pts);
      var started = !!t;
      return {
        n: x.n, type: x.type, title: x.title, context: x.context, desc: x.desc, ready: true, soon: false,
        cls: "card ms ready" + (done ? " done" : ""),
        status: done ? pts + " pts" : started ? cnt + " / 15 dicek" : "Belum dimulai",
        hasMedal: done, medal: md.name, badgeCls: md.badge,
        hasTime: started, time: fmt(self.elapsed(x.id)),
        pct: Math.round(cnt / 15 * 100),
        cta: done ? "Lihat hasil" : started ? "Lanjutkan" : "Mulai misi",
        open: function () { self.openMission(x.id); }
      };
    });

    /* ---- mission data ---- */
    var points = m ? this.missionPoints(m) : 0;
    var groups = [];
    var paras = [], gloss = [], glossNow = { word: "", en: "", id: "" };
    if (m) {
      groups = ["l1", "l2", "l3"].map(function (lv, gi) {
        return { label: "L" + (gi + 1), segs: m.qs.filter(function (q) { return q.lv === lv; }).map(function (q) {
          var k = m.id + "/" + q.id, cls = "sgm";
          if (st.checked[k]) cls += self.isCorrect(q, st.ans[k]) ? " ok" : " bad";
          else if (scene === q.id) cls += " cur";
          return { cls: cls };
        }) };
      });
      paras = m.paras.map(function (p, i) { return { n: i + 1, text: p.text, stage: p.stage, cls: "para " + p.k }; });
      gloss = m.gloss.map(function (g, i) { return { word: g.word, cls: "gw" + (st.gloss === i ? " on" : ""), pick: function () { self.setState({ gloss: self.state.gloss === i ? -1 : i }); } }; });
      if (st.gloss >= 0 && m.gloss[st.gloss]) glossNow = m.gloss[st.gloss];
    }

    var accs = ["l1", "l2", "l3"].map(function (lv, i) {
      var L = LEVELS[lv], open = st.acc === i;
      return { n: L.n, title: L.title, short: L.short, desc: L.desc, items: L.items.map(function (t) { return { t: t }; }),
        open: open, cls: "acc" + (open ? " open" : ""), numCls: "num disp " + lv,
        toggle: function () { self.setState({ acc: self.state.acc === i ? -1 : i }); } };
    });

    var gate = { steps: [] };
    if (kind === "gate") {
      var lvk = scene.slice(2), G = LEVELS[lvk];
      gate = { n: G.n, chip: G.chip, chipCls: "chip " + lvk, numCls: "bignum disp " + lvk, title: G.title, lead: G.lead, steps: G.steps };
    }
    var q = { options: [], items: [] };
    if (kind === "q" && m) q = this.buildQ(m, qById(m, scene));

    /* ---- bottom nav ---- */
    var nextLabel = "Next", nextLocked = false, midLabel = "", backLabel = "Back", answered = m ? this.missionChecked(m) : 0;
    if (scene === "know") { nextLabel = "Got it"; midLabel = "Kenali bagian-bagian soal"; }
    if (scene === "levels") { nextLabel = "To the missions"; midLabel = "Buka setiap level"; }
    if (kind === "read") { nextLabel = "Start Level 1"; midLabel = "Baca dulu sampai selesai"; backLabel = "Missions"; }
    if (kind === "gate") { nextLabel = "Start challenge " + (scene === "g:l1" ? "1" : scene === "g:l2" ? "6" : "11"); midLabel = gate.chip; }
    if (kind === "q") {
      var k0 = m.id + "/" + scene;
      nextLocked = !st.checked[k0];
      nextLabel = scene === "q15" ? "See my medal" : "Next";
      midLabel = nextLocked ? "Jawab dan cek dulu untuk lanjut" : answered + " dari 15 selesai";
    }

    /* ---- result ---- */
    var titles = { l1: "Finding Facts", l2: "Connecting Clues", l3: "Thinking Critically" };
    var advice = {
      l1: ["Latih scanning kata kunci (nama, waktu, tempat, angka), lalu cocokkan dengan kalimat di teks.", "Hampir! Pengecoh Level 1 sering benar, tapi berasal dari bagian teks yang lain.", "Kuat. Kamu teliti menemukan fakta."],
      l2: ["Kumpulkan 2–3 petunjuk dulu sebelum memilih kesimpulan.", "Hampir! Pilih kesimpulan yang paling dekat dengan bukti.", "Kuat. Kamu pandai menghubungkan petunjuk."],
      l3: ["Pakai 3 langkah: locate evidence, read the signal, eliminate.", "Hampir! Kalimat yang benar di teks belum tentu relevan.", "Kuat. Penilaianmu sudah berbasis bukti."]
    };
    var lres = [], correctCount = 0, firstTry = 0;
    if (m) {
      lres = ["l1", "l2", "l3"].map(function (lv) {
        var s = m.qs.filter(function (x) { var k = m.id + "/" + x.id; return x.lv === lv && st.checked[k] && self.isCorrect(x, st.ans[k]); }).length;
        return { chip: LEVELS[lv].chip, chipCls: "chip " + lv, title: titles[lv], score: s, pct: Math.round(s / 5 * 100), advice: advice[lv][s === 5 ? 2 : s >= 3 ? 1 : 0] };
      });
      m.qs.forEach(function (x) { var g = self.gainFor(m, x); if (g > 0) correctCount++; if (g === 10) firstTry++; });
    }
    var medal = this.medalFor(points);
    var overall = points >= 130 ? "Luar biasa! Coba misi berikutnya, atau ulangi misi ini untuk memperbaiki waktumu."
      : points >= 95 ? "Bagus! Sedikit lagi menuju emas (130 pts). Lihat level dengan skor terendah, lalu main lagi."
      : "Ini latihan, bukan ujian. Main lagi dan gunakan Hint di setiap soal. Perak di 95 pts, emas di 130 pts.";

    return {
      is: { intro: kind === "intro", know: kind === "know", levels: kind === "levels", map: kind === "map", read: kind === "read", gate: kind === "gate", q: kind === "q", result: kind === "result" },
      sceneCls: "scene " + (st.moves % 2 ? "b" : "a"),
      barCls: "bar" + (run ? "" : " quiet"),
      ptsCls: "pill pts" + (st.bump === 0 ? "" : st.bump % 2 ? " bA" : " bB"),
      groups: groups, points: points,
      clock: m ? fmt(this.elapsed(m.id)) : "00:00",
      pct: run ? Math.round(st.i / LAST * 100) : Math.round(ONB.indexOf(st.view) / (ONB.length - 1) * 100),
      mission: m || { type: "", title: "", words: 0 },
      missions: missions, tally: { pts: tallyPts, done: tallyDone, ready: MISSIONS.length },
      paras: paras, gloss: gloss, glossCount: gloss.length, hasGloss: st.gloss >= 0, glossNow: glossNow,
      showStruct: st.showStruct,
      readerCls: "card reader" + (st.showStruct ? " struct" : ""),
      structCls: "toggle" + (st.showStruct ? " on" : ""),
      toggleStruct: function () { self.setState({ showStruct: !self.state.showStruct }); },
      wbOpen: st.wb, wbCls: "acc" + (st.wb ? " open" : ""), toggleWB: function () { self.setState({ wb: !self.state.wb }); },
      refOpen: st.ref, refCls: "acc" + (st.ref ? " open" : ""), toggleRef: function () { self.setState({ ref: !self.state.ref }); },
      showText: st.showText, textLabel: st.showText ? "Hide text" : "Show text",
      toggleText: function () { self.setState({ showText: !self.state.showText }); },
      accs: accs, gate: gate, q: q,
      showNav: kind === "know" || kind === "levels" || kind === "read" || kind === "gate" || kind === "q",
      nextLabel: nextLabel, nextLocked: nextLocked, midLabel: midLabel, backLabel: backLabel,
      next: function () {
        var s2 = self.state;
        if (s2.view !== "run") { var oi = ONB.indexOf(s2.view); self.goOnb(ONB[Math.min(ONB.length - 1, oi + 1)]); return; }
        var sc = MS[s2.i];
        if (/^q\d+$/.test(sc) && !s2.checked[s2.mid + "/" + sc]) return;
        self.goScene(s2.i + 1);
      },
      back: function () {
        var s2 = self.state;
        if (s2.view !== "run") { var oi = ONB.indexOf(s2.view); self.goOnb(ONB[Math.max(0, oi - 1)]); return; }
        if (s2.i === 0) { self.goOnb("map"); return; }
        self.goScene(s2.i - 1);
      },
      toMap: function () { if (self.state.view === "intro") return; self.goOnb("map"); },
      toKnow: function () { self.goOnb("know"); },
      lres: lres, medal: medal, overall: overall, correctCount: correctCount, firstTry: firstTry,
      restart: function () { self.restartMission(); }
    };
  }
}

  chev: html`<span class="chev"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg></span>`,

  star: html`<svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.6L12 17.3 6.1 20.6l1.3-6.6L2.5 9.4l6.6-.8z"></path></svg>`,
  bulb: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 18h6M10 21h4M12 3a6 6 0 0 0-3.5 10.9c.6.5 1 1.2 1 2.1h5c0-.9.4-1.6 1-2.1A6 6 0 0 0 12 3z"></path></svg>`,
  doc: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 11h6M9 15h6"></path></svg>`,
  expand: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5"></path></svg>`,
  shrink: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4v5H4M15 4v5h5M9 20v-5H4M15 20v-5h5"></path></svg>`,
  ext: html`<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h6v6M20 4l-9 9M18 14v5a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V7a1 1 0 0 1 1-1h5"></path></svg>`
};

/* ---------- fullscreen helper ---------- */
var FS = {
  inFrame: (function () { try { return window.self !== window.top; } catch (e) { return true; } })(),
  can: function () { var d = document; return !!(d.fullscreenEnabled || d.webkitFullscreenEnabled); },
  active: function () { var d = document; return !!(d.fullscreenElement || d.webkitFullscreenElement); },
  enter: function () {
    var el = document.documentElement;
    var fn = el.requestFullscreen || el.webkitRequestFullscreen;
    try { var p = fn.call(el); if (p && p.catch) p.catch(function () { FS.openTab(); }); } catch (e) { FS.openTab(); }
  },
  exit: function () { var d = document; var fn = d.exitFullscreen || d.webkitExitFullscreen; try { fn && fn.call(d); } catch (e) {} },
  openTab: function () { try { window.open(location.href, "_blank", "noopener"); } catch (e) {} },
  /* "fs" = real fullscreen, "tab" = open in a new tab (Google Sites, iPhone), "none" = already a full page without fullscreen support */
  mode: function () { return FS.can() ? "fs" : (FS.inFrame ? "tab" : "none"); }
};

/* ---------- save progress in this browser ---------- */
var SAVE_KEY = "tka-reading-lab-v1";
var SAVED_FIELDS = ["view", "ans", "checked", "tries", "pos", "timers"];

class App extends TkaCore {
  constructor(props) {
    super(props);
    this.state.fsOn = false;
    try {
      var raw = localStorage.getItem(SAVE_KEY);
      if (raw) {
        var s = JSON.parse(raw), now = Date.now();
        SAVED_FIELDS.forEach(function (f) { if (s[f] !== undefined) this.state[f] = s[f]; }, this);
        var t = this.state.timers || {};
        for (var k in t) { if (t[k] && t[k].since) t[k] = { acc: t[k].acc + Math.max(0, (s.savedAt || now) - t[k].since), since: null, done: t[k].done }; }
        if (this.state.view === "run") this.state.view = "map";
        this.state.now = now;
      }
    } catch (e) {}
  }
  componentDidMount() {
    super.componentDidMount();
    var self = this;
    this.onFs = function () { self.setState({ fsOn: FS.active() }); };
    document.addEventListener("fullscreenchange", this.onFs);
    document.addEventListener("webkitfullscreenchange", this.onFs);
  }
  componentDidUpdate(pp, ps) {
    super.componentDidUpdate(pp, ps);
    try {
      var st = this.state, o = { savedAt: Date.now() };
      SAVED_FIELDS.forEach(function (f) { o[f] = st[f]; });
      localStorage.setItem(SAVE_KEY, JSON.stringify(o));
    } catch (e) {}
  }
  toggleFs() { if (FS.active()) FS.exit(); else FS.enter(); }

  render() {
    var v = this.renderVals(), self = this;
    var fsMode = FS.mode();
    var fsBtn = fsMode === "none" ? null
      : fsMode === "tab"
        ? html`<a class="fsbtn" href=${location.href} target="_blank" rel="noopener" aria-label="Buka layar penuh di tab baru" title="Buka layar penuh">${ICON.ext}<span class="fsl">Layar penuh</span></a>`
        : html`<button class="fsbtn" onClick=${function () { self.toggleFs(); }} aria-label=${this.state.fsOn ? "Keluar dari layar penuh" : "Layar penuh"} title="Layar penuh">${this.state.fsOn ? ICON.shrink : ICON.expand}<span class="fsl">${this.state.fsOn ? "Keluar" : "Layar penuh"}</span></button>`;

    var para = function (p) { return html`<div class=${p.cls}><span class="pn">¶${p.n}</span><div><span class="stg-l">${p.stage}</span><p>${p.text}</p></div></div>`; };

    return html`<div class="app">
  <header class=${v.barCls}>
    <div class="wrap barin">
      <button class="brand" onClick=${v.toMap} aria-label="Kembali ke peta misi"><span class="mark disp">TKA</span><span class="bname disp">Reading Lab</span></button>
      <div class="track" aria-label="Progress soal">
        ${v.groups.map(function (g) { return html`<div class="grp"><span class="glab">${g.label}</span>${g.segs.map(function (s) { return html`<span class=${s.cls}></span>`; })}</div>`; })}
      </div>
      <div class="pill clock" aria-label="Waktu yang sudah kamu pakai">${ICON.clock} ${v.clock}</div>
      <div class=${v.ptsCls} aria-label="Poin">${ICON.star} ${v.points}</div>
      ${fsBtn}
    </div>
    <div class="line"><i style=${"width:" + v.pct + "%"}></i></div>
  </header>

  <div class="stage"><div class=${v.sceneCls}>

    ${v.is.intro && html`<section class="wrap narrow intro stg">
      <div class="introArt" aria-hidden="true"><span style="height:36px;background:#2B44C2"></span><span style="height:62px;background:#F3CF55"></span><span style="height:88px;background:#15202B"></span></div>
      <p class="eyebrow">TKA Reading Lab · Bahasa Inggris</p>
      <h1 class="h1 disp">Read like a <em>TKA reader.</em></h1>
      <p class="lead">Berlatih membaca seperti di TKA lewat 5 misi, satu jenis teks di setiap misi. Setiap misi berisi 15 tantangan yang makin menantang. Kumpulkan poin, raih medali, dan lihat berapa lama waktu yang kamu butuhkan.</p>
      <div class="facts"><span class="chip plain">5 jenis teks</span><span class="chip plain">15 tantangan per misi</span><span class="chip plain">150 pts per misi</span><span class="chip plain">Stopwatch</span></div>
      <div><button class="btn dark" onClick=${v.next}>Let's start ${ICON.arrow}</button></div>
    </section>`}

    ${v.is.know && html`<section class="wrap">
      <div class="stg"><p class="eyebrow">Cara bermain · 1 dari 2</p><h2 class="h2 disp" style="margin-top:10px">Setiap soal punya 4 bagian.</h2></div>
      <div class="parts stg">
        <div class="card part"><span class="n">01</span><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"></circle><circle cx="12" cy="12" r="5"></circle><circle cx="12" cy="12" r="1"></circle></svg></div><h3 class="disp">The Goal</h3><p>Kemampuan yang diuji. Kamu akan melihatnya di label "Skill".</p></div>
        <div class="card part"><span class="n">02</span><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h8l4 4v14H6z"></path><path d="M9 11h6M9 15h6M9 7h3"></path></svg></div><h3 class="disp">The Text</h3><p>Sumber semua jawaban. Jawaban yang benar selalu punya bukti di teks.</p></div>
        <div class="card part"><span class="n">03</span><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M9 9a3 3 0 1 1 4 2.8c-.7.3-1 .9-1 1.7V14"></path><circle cx="12" cy="18" r=".6"></circle><circle cx="12" cy="12" r="9.5"></circle></svg></div><h3 class="disp">The Question</h3><p>Apa yang diminta. Temukan kata kuncinya: <i>when, why, best</i>.</p></div>
        <div class="card part"><span class="n">04</span><div class="ic"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 6h3M4 12h3M4 18h3M10 6h10M10 12h10M10 18h5"></path><path d="M16.5 18l1.5 1.5 3-3"></path></svg></div><h3 class="disp">The Choices</h3><p>Satu jawaban benar, sisanya pengecoh: terlihat benar, tapi tidak ada buktinya.</p></div>
      </div>
    </section>`}

    ${v.is.levels && html`<section class="wrap narrow">
      <div class="stg"><p class="eyebrow">Cara bermain · 2 dari 2</p><h2 class="h2 disp" style="margin-top:10px">Tiga level, makin dalam.</h2></div>
      <div class="accs stg">
        ${v.accs.map(function (a) { return html`<div class=${a.cls}>
          <button class="acc-h" onClick=${a.toggle} aria-expanded=${a.open ? "true" : "false"}><span class=${a.numCls}>${a.n}</span><span class="tt"><b>${a.title}</b><span>${a.short}</span></span>${ICON.chev}</button>
          <div class="acc-b"><div class="acc-in"><div class="acc-pad"><p>${a.desc}</p><ul class="ticks">${a.items.map(function (t) { return html`<li>${t.t}</li>`; })}</ul></div></div></div>
        </div>`; })}
      </div>
      <p class="tapnote">Ketuk setiap level untuk melihat isinya.</p>
    </section>`}

    ${v.is.map && html`<section class="wrap">
      <div class="maphead stg">
        <div><p class="eyebrow">Pilih misimu</p><h2 class="h2 disp" style="margin-top:10px">5 teks, 5 misi.</h2><p class="lead" style="margin-top:10px">Saran urutan: kerjakan dari misi 1. Kamu boleh berhenti dan melanjutkan kapan saja. Progresmu tersimpan di perangkat ini.</p></div>
        <div class="tally"><span class="chip plain">${v.tally.done} / ${v.tally.ready} misi selesai</span><span class="chip plain">★ ${v.tally.pts} pts total</span></div>
      </div>
      <div class="missions stg">
        ${v.missions.map(function (m) { return html`<div class=${m.cls}>
          <div class="mtop"><span class="mnum disp">${m.n}</span><span class="chip plain">${m.context}</span></div>
          <p class="eyebrow">${m.type}</p>
          <h3 class="mt disp">${m.title}</h3>
          <p class="md">${m.desc}</p>
          ${m.ready && html`<div class="mstat"><span>${m.status}</span>${m.hasMedal && html`<span class=${m.badgeCls}>${m.medal}</span>`}${m.hasTime && html`<span>⏱ ${m.time}</span>`}</div>
            <div class="mbar"><i style=${"width:" + m.pct + "%"}></i></div>
            <button class="btn dark" onClick=${m.open}>${m.cta}</button>`}
          ${m.soon && html`<span class="soonTag">Segera hadir</span>`}
        </div>`; })}
      </div>
      <div class="btnrow"><button class="link" onClick=${v.toKnow}>Lihat lagi cara bermain</button></div>
    </section>`}

    ${v.is.read && html`<section class="wrap narrow">
      <div class="readhead stg">
        <div><p class="eyebrow">${v.mission.type} · Read the whole text first</p><h2 class="h2 disp" style="margin-top:10px">Read it once, all the way.</h2></div>
        <button class=${v.structCls} onClick=${v.toggleStruct} aria-pressed=${v.showStruct ? "true" : "false"}><span class="sw"></span>Show structure</button>
      </div>
      <div class="stg">
        <div class=${v.readerCls}>
          <h3 class="disp">${v.mission.title}</h3>
          <p class="rmeta">${v.mission.type} · ${v.mission.words} words · ¶ = paragraph</p>
          ${v.paras.map(para)}
        </div>
        <div class=${v.wbCls} style="margin-top:12px">
          <button class="acc-h" onClick=${v.toggleWB} aria-expanded=${v.wbOpen ? "true" : "false"}><span class="num" style="background:#F3CF55;color:#15202B;font-size:15px">Aa</span><span class="tt"><b>Word bank</b><span>${v.glossCount} kata yang mungkin baru untukmu</span></span>${ICON.chev}</button>
          <div class="acc-b"><div class="acc-in"><div class="acc-pad">
            <div class="gwords">${v.gloss.map(function (g) { return html`<button class=${g.cls} onClick=${g.pick}>${g.word}</button>`; })}</div>
            ${v.hasGloss && html`<p class="gdef"><b>${v.glossNow.word}</b> — ${v.glossNow.en} <span style="color:#4A5562">(${v.glossNow.id})</span></p>`}
          </div></div></div>
        </div>
      </div>
    </section>`}

    ${v.is.gate && html`<section class="wrap gate stg">
      <span class=${v.gate.chipCls}>${v.gate.chip}</span>
      <div class=${v.gate.numCls}>${v.gate.n}</div>
      <h2 class="h2 disp">${v.gate.title}</h2>
      <p class="lead">${v.gate.lead}</p>
      <div class="strat">${v.gate.steps.map(function (s) { return html`<div class="card st"><span class="sn">${s.n}</span><b>${s.t}</b><span>${s.d}</span></div>`; })}</div>
      <div class="gatemeta"><span class="chip plain">5 challenges</span><span class="chip plain">+10 pts tiap benar di percobaan pertama</span></div>
    </section>`}

    ${v.is.q && html`<section class="wrap">
      <div class="qtop">
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap"><span class=${v.q.chipCls}>${v.q.levelName}</span><span class="chip plain">Skill · ${v.q.sub}</span></div>
        <span class="qcount">Challenge <b>${v.q.num}</b> / 15</span>
      </div>
      <div class="qlayout">
        ${v.showText && html`<button class="scrim" onClick=${v.toggleText} aria-label="Close the text"></button>
          <aside class="qtext" aria-label="Reading text"><div class=${v.readerCls}>
            <div class="sheethead"><b>${v.mission.title}</b><button onClick=${v.toggleText}>Close</button></div>
            <h3 class="disp" style="font-size:20px">${v.mission.title}</h3>
            <p class="rmeta">Look for evidence ¶</p>
            ${v.paras.map(para)}
          </div></aside>`}
        <div class="qmain stg"><article class="card qcard">
          <p class="stem">${v.q.stem}</p>
          <p class="instr">${v.q.instr}</p>
          ${v.q.isOpts && html`<div class="opts" role="group" aria-label="Pilihan jawaban">${v.q.options.map(function (o) { return html`<button class=${o.cls} onClick=${o.pick} aria-pressed=${o.pressed ? "true" : "false"}><span class="lt">${o.letter}</span><span class="ot">${o.text}</span><span class="tagr">${o.tag}</span></button>`; })}</div>`}
          ${v.q.isCat && html`<div class="cat">${v.q.items.map(function (it) { return html`<div class=${it.cls}><span class="cattext">${it.text}</span><div class="seg" role="group" aria-label=${it.text}>${it.choices.map(function (c) { return html`<button class=${c.cls} onClick=${c.pick} aria-pressed=${c.pressed ? "true" : "false"}>${c.name}</button>`; })}</div></div>`; })}</div>`}
          <div class=${v.q.hintCls}><div><div class="hint"><b>Hint</b>${v.q.hint}</div></div></div>
          ${v.q.checked && html`<div class=${v.q.fbCls}>
            <div class="vd">${v.q.verdict}${v.q.gained && html`<span class="plus">+${v.q.gain} pts</span>`}</div>
            <p class="det">${v.q.detail}</p>
            <div class=${v.q.expCls}><div><p class="exp">${v.q.explain}</p></div></div>
          </div>`}
          <div class="qfoot">
            ${v.q.open && html`<button class="btn" onClick=${v.q.check} disabled=${v.q.noCheck}>Check answer</button>`}
            ${v.q.canRetry && html`<button class="btn ghost" onClick=${v.q.retry}>Try again · +5 pts</button>`}
            ${v.q.checked && html`<button class="link" onClick=${v.q.toggleExp} aria-expanded=${v.q.showExp ? "true" : "false"}>${v.q.expLabel}</button>`}
            ${v.q.open && html`<button class="link" onClick=${v.q.toggleHint} aria-expanded=${v.q.showHint ? "true" : "false"}>${ICON.bulb} ${v.q.hintLabel}</button>`}
            <button class="link tx" onClick=${v.toggleText} aria-expanded=${v.showText ? "true" : "false"} style="margin-left:auto">${ICON.doc} ${v.textLabel}</button>
          </div>
        </article></div>
      </div>
    </section>`}

    ${v.is.result && html`<section class="wrap">
      <div class="reshead stg">
        <div class=${v.medal.cls}><div><b>${v.points}</b><span>${v.medal.name}</span></div></div>
        <div style="flex:1 1 320px"><p class="eyebrow">${v.mission.type} · mission complete</p><h2 class="h2 disp" style="margin-top:8px">${v.medal.title}</h2><p class="lead" style="margin-top:10px">${v.overall}</p></div>
      </div>
      <div class="stats stg">
        <div class="card stat"><span>Waktu</span><b>${v.clock}</b></div>
        <div class="card stat"><span>Benar</span><b>${v.correctCount} / 15</b></div>
        <div class="card stat"><span>Benar di percobaan pertama</span><b>${v.firstTry} / 15</b></div>
      </div>
      <div class="lres stg">${v.lres.map(function (r) { return html`<div class="card lr"><span class=${r.chipCls} style="align-self:flex-start">${r.chip}</span><h3 class="disp">${r.title}</h3><div class="meter"><i style=${"width:" + r.pct + "%"}></i></div><span class="num">${r.score} / 5 benar</span><p>${r.advice}</p></div>`; })}</div>
      <div class=${v.refCls} style="margin-top:12px">
        <button class="acc-h" onClick=${v.toggleRef} aria-expanded=${v.refOpen ? "true" : "false"}><span class="num" style="background:#15202B;color:#FFFFFF;font-size:15px">?</span><span class="tt"><b>Refleksi</b><span>3 pertanyaan untuk buku catatanmu</span></span>${ICON.chev}</button>
        <div class="acc-b"><div class="acc-in"><div class="acc-pad"><ul class="ticks">
          <li>Level mana yang paling sulit bagimu? Mengapa?</li>
          <li>Pengecoh mana yang hampir kamu pilih? Apa yang membuatnya terlihat benar?</li>
          <li>Tulis satu strategi yang akan kamu pakai di teks berikutnya.</li>
        </ul></div></div></div>
      </div>
      <div class="btnrow"><button class="btn dark" onClick=${v.toMap}>Back to missions</button><button class="btn ghost" onClick=${v.restart}>Play this mission again</button></div>
    </section>`}

  </div></div>

  ${v.showNav && html`<nav class="bnav" aria-label="Navigasi"><div class="wrap bnavin">
    <button class="btn ghost" onClick=${v.back} style="padding:12px 20px">${ICON.back} ${v.backLabel}</button>
    <span class="bmid">${v.midLabel}</span>
    <button class="btn" onClick=${v.next} disabled=${v.nextLocked}>${v.nextLabel} ${ICON.arrow}</button>
  </div></nav>`}
</div>`;
  }
}

prender(html`<${App} />`, document.getElementById("root"));

</script>
</body>
</html>
